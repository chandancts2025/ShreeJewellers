<section class="app-page">
  <div class="container">
    <div class="row g-4">
      <div class="col-lg-7">
        <div class="lux-card p-4">
          <div class="section-kicker mb-2">Profile</div>
          <div class="section-title mb-4">My Details</div>
          <form [formGroup]="profileForm" class="row g-3">
            <div class="col-md-6"><label class="form-label">First Name</label><input class="form-control" formControlName="firstName"></div>
            <div class="col-md-6"><label class="form-label">Last Name</label><input class="form-control" formControlName="lastName"></div>
            <div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" formControlName="phoneNumber"></div>
            <div class="col-md-6"><label class="form-label">Alternate Phone</label><input class="form-control" formControlName="alternatePhone"></div>
            <div class="col-md-6"><label class="form-label">Date of Birth</label><input class="form-control" type="date" formControlName="dateOfBirth"></div>
            <div class="col-md-6"><label class="form-label">Gender</label><input class="form-control" formControlName="gender"></div>
            <div class="col-12"><label class="form-label">Address</label><input class="form-control" formControlName="addressLine1"></div>
            <div class="col-12"><label class="form-label">Address Line 2</label><input class="form-control" formControlName="addressLine2"></div>
            <div class="col-md-4"><label class="form-label">City</label><input class="form-control" formControlName="city"></div>
            <div class="col-md-4"><label class="form-label">State</label><input class="form-control" formControlName="state"></div>
            <div class="col-md-4"><label class="form-label">PIN Code</label><input class="form-control" formControlName="pinCode"></div>
            <div class="col-12"><button type="button" class="btn lux-btn lux-btn-primary" (click)="saveProfile()">Save Profile</button></div>
          </form>
        </div>
      </div>
      <div class="col-lg-5">
        <div class="lux-card p-4 mb-4">
          <div class="font-display fs-2 mb-3">Account Status</div>
          <div class="small text-secondary mb-2">{{ profile?.email }}</div>
          <span class="status-badge" [class.status-verified]="profile?.kycStatus === 'Verified'" [class.status-pending]="profile?.kycStatus !== 'Verified'">
            {{ profile?.kycStatus }}
          </span>
          <div class="mt-4">
            <label class="form-label">Upload Profile Photo</label>
            <input class="form-control" type="file" (change)="uploadDocument($event, 'profilePhoto')">
          </div>
          <div class="mt-3">
            <label class="form-label">Upload ID Proof</label>
            <input class="form-control" type="file" (change)="uploadDocument($event, 'idProof')">
          </div>
        </div>
        <div class="lux-card p-4">
          <div class="font-display fs-2 mb-3">Change Password</div>
          <form [formGroup]="passwordForm" class="row g-3">
            <div class="col-12"><label class="form-label">Current Password</label><input class="form-control" type="password" formControlName="currentPassword"></div>
            <div class="col-12"><label class="form-label">New Password</label><input class="form-control" type="password" formControlName="newPassword"></div>
            <div class="col-12"><label class="form-label">Confirm Password</label><input class="form-control" type="password" formControlName="confirmPassword"></div>
            <div class="col-12"><button type="button" class="btn lux-btn lux-btn-outline" (click)="changePassword()">Update Password</button></div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
