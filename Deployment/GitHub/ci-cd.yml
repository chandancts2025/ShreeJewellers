name: Shree Jewellers — CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: shreejewellers

jobs:
  # ── Job 1: Security Scan ──────────────────────────────────────
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — Secrets Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        # This will FAIL the build if any secrets/credentials are found in code

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: NuGet Vulnerability Audit
        run: |
          dotnet restore
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt
          if grep -q "has the following vulnerable packages" vuln-report.txt; then
            echo "::error::Critical NuGet vulnerabilities detected!"
            cat vuln-report.txt
            exit 1
          fi
        working-directory: src

      - name: Check for Outdated Packages (Warning Only)
        run: dotnet list package --outdated --include-transitive || true
        working-directory: src

  # ── Job 2: Build & Test ───────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: security-scan
    services:
      # SQL Server for integration tests
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: TestP@ssword123!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'TestP@ssword123!' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet Packages
        run: dotnet restore ShreeJewellers.sln

      - name: Build Solution
        run: |
          dotnet build ShreeJewellers.sln \
            --configuration Release \
            --no-restore \
            -warnaserror

      # Unit Tests — No external dependencies
      - name: Run Unit Tests
        run: |
          dotnet test tests/ShreeJewellers.UnitTests/ShreeJewellers.UnitTests.csproj \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=unit-test-results.trx" \
            --collect:"XPlat Code Coverage" \
            /p:CoverletOutputFormat=lcov

      # Integration Tests — Uses InMemory DB by default, SQL if needed
      - name: Run Integration Tests
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=ShreeJewellers_Test;User=sa;Password=TestP@ssword123!;TrustServerCertificate=True"
          JWT_SECRET_KEY: "ci-test-jwt-secret-key-min-32-chars-padding"
          AES_ENCRYPTION_KEY: "Y2ktdGVzdC1hZXMta2V5LTMyLWJ5dGVzLXBhZA=="
        run: |
          dotnet test tests/ShreeJewellers.IntegrationTests/ShreeJewellers.IntegrationTests.csproj \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=integration-test-results.trx"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/*.trx"

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: "**/coverage.info"

      # Code coverage gate: fail if below 70%
      - name: Coverage Gate
        run: |
          dotnet tool install --global dotnet-coverage || true
          COVERAGE=$(dotnet test tests/ShreeJewellers.UnitTests \
            --collect:"XPlat Code Coverage" \
            --results-directory coverage \
            /p:Threshold=70 \
            /p:ThresholdType=line 2>&1 | tail -1)
          echo "$COVERAGE"
        continue-on-error: true  # Warning only for now; set to false when coverage is stable

  # ── Job 3: Docker Build & Push ────────────────────────────────
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/shreejewellers-api
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYY-MM-DD'}}

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Deployment/Docker/Dockerfile.API
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.run_id }}
            GIT_SHA=${{ github.sha }}

      - name: Extract Metadata (Web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/shreejewellers-web
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Deployment/Docker/Dockerfile.Web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker Scout — Image Vulnerability Scan (API)
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/shreejewellers-api:latest
          only-severities: critical,high
          exit-code: true
        continue-on-error: true  # Don't block deploy for now; monitor and harden

  # ── Job 4: Deploy to Staging ──────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build
    environment: staging
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/shreejewellers
            
            # Pull latest images
            docker pull ghcr.io/${{ github.repository_owner }}/shreejewellers-api:latest
            docker pull ghcr.io/${{ github.repository_owner }}/shreejewellers-web:latest
            
            # Run EF Core migrations
            docker run --rm \
              --network sj-network \
              -e ConnectionStrings__DefaultConnection="${{ secrets.STAGING_DB_CONNECTION }}" \
              ghcr.io/${{ github.repository_owner }}/shreejewellers-api:latest \
              dotnet ShreeJewellers.API.dll --migrate-only || true
            
            # Restart services with zero downtime (rolling update)
            docker-compose pull
            docker-compose up -d --no-deps --scale api=2 api
            sleep 15
            docker-compose up -d --no-deps --scale api=1 api
            docker-compose up -d --no-deps web
            
            # Smoke test
            sleep 10
            curl -f http://localhost/health/ready || (echo "Health check failed!" && exit 1)
            
            echo "Deployment successful: $(date)"

      - name: Notify Slack on Success
        if: success()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-type: application/json' \
            --data '{"text":"✅ Shree Jewellers Staging deployed: ${{ github.sha }} by ${{ github.actor }}"}'

      - name: Notify Slack on Failure
        if: failure()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-type: application/json' \
            --data '{"text":"❌ Shree Jewellers Staging deployment FAILED: ${{ github.sha }}"}'
